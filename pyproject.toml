[project]
name = "astral-decomposition"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
claude = ["anthropic"]
data = ["pyarrow"]   # reading the astral-expmath datasets (util/agda_data.py)
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
